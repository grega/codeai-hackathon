<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Animation Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #eee;
    font-family: -apple-system, sans-serif; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 1rem; text-align: center; }
  .spinner { width: 32px; height: 32px; border: 3px solid #444; border-top-color: #8ab4f8;
    border-radius: 50%; animation: spin 0.8s linear infinite; }
  pre { color: #f66; white-space: pre-wrap; max-width: 80%; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const prompt = params.get("prompt");

  if (error) {
    const pre = document.createElement("pre");
    pre.textContent = error;
    document.body.appendChild(pre);
  } else {
    const spinner = document.createElement("div");
    spinner.className = "spinner";
    document.body.appendChild(spinner);
    const msg = document.createElement("div");
    msg.textContent = `Generating "${prompt || ""}"...`;
    document.body.appendChild(msg);
  }
</script>
</body>
</html>
